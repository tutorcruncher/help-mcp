version: 1
name: tc-help-mcp

isolation:
  portStep: 100
  redis:
    mode: server

repos:
  app:
    path: .

services:
  mcp:
    repo: app
    command: make run-dev
    port: 8000
    depends_on: [redis]
    env:
      PORT: "${port}"
      BASE_URL: "http://localhost:${port}"
    ready:
      type: port
      port: "${port}"
